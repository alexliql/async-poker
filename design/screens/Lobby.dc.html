<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby, host view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#E3E6EB;--fg:#15181D;--muted:#575E6C;--sd:rgba(146,155,171,.55);--sl:rgba(255,255,255,.95);--line:rgba(21,24,29,.07)}
.t-dark{--bg:#1D2025;--fg:#ECEEF2;--muted:#9AA1AD;--sd:rgba(0,0,0,.55);--sl:rgba(255,255,255,.05);--line:rgba(255,255,255,.06)}
.neu{background:var(--bg);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl)}
.neu-sm{background:var(--bg);box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.t-light{--well:#D9DEE5}.t-dark{--well:#16191D}
.inset{background:var(--well);box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.caps{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:0;font:inherit;color:var(--fg);cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(.3,.7,.2,1),box-shadow 160ms ease,opacity 200ms ease}
.btn:focus-visible{outline:2.5px solid var(--fg);outline-offset:3px}
.btn:active{transform:scale(.96);box-shadow:inset 3px 3px 8px var(--sd),inset -3px -3px 8px var(--sl)}
.btn:disabled{cursor:default;transform:none}
.btn:not(.swatch):disabled{opacity:1;background:var(--well)!important;color:var(--muted);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.hit{position:relative}.hit::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.accentBtn{color:#1B0F0A;box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl),inset 0 1px 0 rgba(255,255,255,.35)}
.accentBtn:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#15181D;font-weight:800;box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl),inset 0 1px 0 rgba(255,255,255,.35)}
.pill{height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;background:var(--fg);color:var(--bg)}
@keyframes pop{0%{transform:translateY(10px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
@keyframes rowIn{0%{transform:translateY(16px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.pop{animation:pop 340ms cubic-bezier(.2,1.3,.4,1) both}
.rowIn{animation:rowIn 480ms cubic-bezier(.2,1.25,.4,1) both}
.dots span{animation:blink 1.2s infinite both}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms !important;transition-duration:1ms !important}}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; padding: 36px 24px 24px; background: var(--bg); color: var(--fg); font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span class="caps">Lobby · you’re hosting</span>
    <h1 style="margin: 0; font-size: 44px; line-height: 0.98; font-weight: 800; letter-spacing: -0.04em">Friday Night</h1>
    <div class="mono" style="font-size: 13px; color: var(--muted)">Blinds $1/$2 · $200 buy-in · 12h turns</div>
  </div>

  <div class="neu" style="border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <span class="caps">Invite link</span>
    <div style="display: flex; gap: 10px">
      <div class="inset mono" style="flex: 1; min-width: 0; height: 46px; border-radius: 15px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">yourapp.com/t/k7q2</div>
      <button class="btn neu-sm" onClick="{{copy}}" style="width: 92px; height: 46px; border-radius: 15px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
        <sc-if value="{{notCopied}}" hint-placeholder-val="{{ true }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
          <span>Copy</span>
        </sc-if>
        <sc-if value="{{copied}}" hint-placeholder-val="{{ false }}">
          <svg class="pop" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          <span class="pop">Copied</span>
        </sc-if>
      </button>
      <button class="btn neu-sm" aria-label="Share invite" style="width: 46px; height: 46px; border-radius: 15px; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
      </button>
    </div>
    <span style="font-size: 13px; color: var(--muted)">Drop it in the group chat. Anyone with the link can grab a seat.</span>
  </div>

  <div class="neu" style="flex: 1; min-height: 0; border-radius: 24px; padding: 16px 16px 8px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px">
      <span class="caps">Seated</span>
      <span class="mono" style="font-size: 12px; color: var(--muted)">{{count}} of 8</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div class="rowIn" style="display: flex; align-items: center; gap: 12px; height: 58px; border-top: {{r.border}}">
        <div class="avatar" style="width: 38px; height: 38px; font-size: 15px; background: {{r.hex}}">{{r.ini}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">{{r.name}}</span>
            <sc-if value="{{r.host}}" hint-placeholder-val="{{ false }}"><span class="pill">Host · you</span></sc-if>
          </div>
          <span style="font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
        </div>
        <span class="mono" style="font-size: 13px; font-weight: 600">$200</span>
        <sc-if value="{{r.canKick}}" hint-placeholder-val="{{ false }}">
          <button class="btn neu-sm hit" aria-label="{{r.kickLabel}}" onClick="{{r.kick}}" style="width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
          </button>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{moreComing}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px">
        <div class="inset" style="width: 38px; height: 38px; border-radius: 50%; flex: none"></div>
        <span>Waiting for players</span>
        <span class="dots" style="font-weight: 800; letter-spacing: 2px"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{canStart}}" hint-placeholder-val="{{ false }}">
    <a href="Main.dc.html" class="btn accentBtn pop" style="height: 58px; flex: none; border-radius: 20px; font-size: 17px; font-weight: 800; background: {{accent}}; display: flex; align-items: center; justify-content: center">{{startLabel}}</a>
  </sc-if>
  <sc-if value="{{cantStart}}" hint-placeholder-val="{{ true }}">
    <button class="btn neu" disabled="{{ true }}" style="height: 58px; flex: none; border-radius: 20px; font-size: 17px; font-weight: 800">Need at least 2 players</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C6F432","#5AC8FA"]},"$preview":{"width":390,"height":844}}'>
const HOST = { name: 'Mia', ini: 'M', hex: '#9DB8A0', quip: 'Mia never bluffs. Mostly.' };
const GUESTS = [
  { name: 'Jay', ini: 'J', hex: '#93AAC7', quip: 'Jay sends his regards.' },
  { name: 'Priya', ini: 'P', hex: '#C9A08C', quip: 'Priya saw that coming.' },
  { name: 'Sam', ini: 'S', hex: '#B59BB8', quip: 'Sam is just here for snacks.' },
  { name: 'Theo', ini: 'T', hex: '#CDB98A', quip: 'Fortune favors the bold.' },
  { name: 'Kai', ini: 'K', hex: '#8FB3B5', quip: 'Read ’em and weep.' }
];

class Component extends DCLogic {
  state = { arrived: 0, kicked: [], copied: false };
  timers = [];

  componentDidMount() {
    const tick = () => {
      if (this.state.arrived >= GUESTS.length) return;
      this.setState((s) => ({ arrived: s.arrived + 1 }));
      this.timers.push(setTimeout(tick, 1500));
    };
    this.timers.push(setTimeout(tick, 900));
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }

  copy = () => {
    try { if (navigator.clipboard) navigator.clipboard.writeText('https://yourapp.com/t/k7q2').catch(function () {}); } catch (e) {}
    this.setState({ copied: true });
    this.timers.push(setTimeout(() => this.setState({ copied: false }), 1600));
  };

  renderVals() {
    const s = this.state, P = this.props;
    const guests = GUESTS.slice(0, s.arrived).filter((g) => s.kicked.indexOf(g.name) < 0);
    const rows = [{ name: HOST.name, ini: HOST.ini, hex: HOST.hex, sub: '“' + HOST.quip + '”', host: true, canKick: false, kickLabel: '', kick: null, border: 'none' }]
      .concat(guests.map((g) => ({
        name: g.name, ini: g.ini, hex: g.hex, sub: '“' + g.quip + '”', host: false, canKick: true,
        kickLabel: 'Remove ' + g.name, border: '1px solid var(--line)',
        kick: () => this.setState((st) => ({ kicked: st.kicked.concat(g.name) }))
      })));
    const count = rows.length;
    return {
      themeCls: (P.dark ?? false) ? 't-dark' : 't-light',
      accent: P.accent ?? '#FF5B2E',
      rows: rows, count: count,
      moreComing: count < 8,
      canStart: count >= 2, cantStart: count < 2,
      startLabel: 'Deal the first hand · ' + count + ' players',
      copy: this.copy, copied: s.copied, notCopied: !s.copied
    };
  }
}
</script>
</body>
</html>
