<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invite link preview card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.t-light{--bg:#E3E6EB;--fg:#15181D;--muted:#575E6C;--sd:rgba(146,155,171,.55);--sl:rgba(255,255,255,.95);--line:rgba(21,24,29,.07);--back:#2A2F38;--well:#D9DEE5}
.t-dark{--bg:#1D2025;--fg:#ECEEF2;--muted:#9AA1AD;--sd:rgba(0,0,0,.55);--sl:rgba(255,255,255,.05);--line:rgba(255,255,255,.07);--back:#3A404B;--well:#16191D}
.neu{background:var(--bg);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl)}
.neu-sm{background:var(--bg);box-shadow:3px 3px 8px var(--sd),-3px -3px 8px var(--sl)}
.inset{background:var(--well);box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.caps{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:0;font:inherit;color:var(--fg);cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform 140ms cubic-bezier(.3,.7,.2,1),box-shadow 160ms ease,opacity 200ms ease,background-color 200ms ease}
.btn:active{transform:scale(.97);box-shadow:inset 3px 3px 8px var(--sd),inset -3px -3px 8px var(--sl)}
.btn:disabled{cursor:default;transform:none}
.btn:not(.swatch):disabled{opacity:1;background:var(--well)!important;color:var(--muted);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.hit{position:relative}.hit::before{content:"";position:absolute;inset:-7px;border-radius:50%}
.btn:focus-visible{outline:2.5px solid var(--fg);outline-offset:3px}
.ghost{background:transparent;padding:0}
.ghost:active{box-shadow:none}
.accentBtn{color:#1B0F0A;box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl),inset 0 1px 0 rgba(255,255,255,.35)}
.accentBtn:active{box-shadow:inset 3px 3px 8px rgba(0,0,0,.25)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#15181D;font-weight:800;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--sl),inset 0 1px 0 rgba(255,255,255,.35)}
.card{background:#FBFBFC;box-shadow:inset 0 1px 0 #fff,4px 6px 14px var(--sd),-2px -2px 6px var(--sl);font-variant-emoji:text}
.mini{width:19px;height:26px;border-radius:4px;background:#FBFBFC;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-weight:800;font-size:11px;box-shadow:1px 2px 4px var(--sd);font-variant-emoji:text;flex:none}
.back{background:var(--back);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--back),inset 0 0 0 2.5px rgba(255,255,255,.16),2px 2px 4px var(--sd)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 6px;border-radius:13px;font-size:13px;font-weight:700;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);white-space:nowrap}
.pchip{position:relative;display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--fg);flex:none;box-shadow:0 1px 2px var(--sd)}
.pchip::after{content:'';position:absolute;inset:2px;border-radius:50%;border:1.5px dashed var(--bg)}
.pchip.lg{width:20px;height:20px}
.pchip.lg::after{inset:3px;border-width:2px}
.badge{height:20px;min-width:20px;padding:0 6px;box-sizing:border-box;border-radius:10px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg)}
.tag{height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;background:var(--bg);box-shadow:2px 2px 5px var(--sd),-2px -2px 5px var(--sl);white-space:nowrap;display:flex;align-items:center}
.tagS{height:18px;padding:0 7px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;background:var(--fg);color:var(--bg);flex:none}
@keyframes chipIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes toastIn{0%{transform:translateY(-22px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
@keyframes rowIn{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
.chipIn{animation:chipIn 340ms cubic-bezier(.3,1.5,.5,1) both}
.pop{animation:pop 280ms cubic-bezier(.3,1.4,.5,1) both}
.toastIn{animation:toastIn 380ms cubic-bezier(.2,1.2,.4,1) both}
.fade{animation:fade 220ms ease both}
.breathe{animation:breathe 1.6s ease-in-out infinite}
.rowIn{animation:rowIn 380ms cubic-bezier(.2,1.2,.4,1) both}
.bigback{position:absolute;border-radius:22px;background:var(--back);color:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 5px var(--back),inset 0 0 0 7px rgba(255,255,255,.16),18px 22px 40px var(--sd)}
.pill{height:52px;padding:0 22px;border-radius:26px;display:inline-flex;align-items:center;gap:10px;font-size:22px;font-weight:600;background:var(--bg);box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);white-space:nowrap}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Bricolage Grotesque', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; left: 70px; top: 126px; width: 380px; height: 380px">
    <div class="bigback" style="left: 20px; top: 40px; width: 200px; height: 284px; transform: rotate(-11deg)">
      <svg width="108" height="108" viewBox="0.8 1.75 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="16" r="4.5"></circle><path d="M9 11.5V8.5"></path><path d="M6.5 8.5a2.5 2.5 0 0 1 5 0z"></path><path d="M11.2 7.4l7.3 5.1"></path><circle cx="18.5" cy="16.5" r="2.6"></circle></svg>
    </div>
    <div class="bigback" style="left: 150px; top: 10px; width: 200px; height: 284px; transform: rotate(9deg)">
      <svg width="108" height="108" viewBox="0.8 1.75 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="16" r="4.5"></circle><path d="M9 11.5V8.5"></path><path d="M6.5 8.5a2.5 2.5 0 0 1 5 0z"></path><path d="M11.2 7.4l7.3 5.1"></path><circle cx="18.5" cy="16.5" r="2.6"></circle></svg>
    </div>
  </div>

  <div style="position: absolute; left: 500px; top: 108px; right: 64px; display: flex; flex-direction: column; gap: 22px">
    <span class="caps" style="font-size: 20px; letter-spacing: .14em">Mia invited you</span>
    <div style="font-size: 104px; line-height: 0.9; font-weight: 800; letter-spacing: -0.045em">Friday Night Hold’em</div>
    <div style="display: flex; align-items: center; gap: 16px; margin-top: 6px">
      <div style="display: flex">
        <sc-for list="{{seated}}" as="p" hint-placeholder-count="5">
          <div class="avatar" style="width: 52px; height: 52px; margin-right: -10px; font-size: 21px; background: {{p.hex}}; box-shadow: 0 0 0 4px var(--bg)">{{p.ini}}</div>
        </sc-for>
      </div>
      <span style="font-size: 26px; font-weight: 600; margin-left: 14px">5 seated · <span style="color: {{accentText}}">3 open</span></span>
    </div>
    <div style="display: flex; gap: 14px; margin-top: 8px">
      <span class="pill"><svg viewBox="0 0 22 12.4" width="28" height="15.8" aria-hidden="true" style="display: block; flex: none; overflow: visible; filter: drop-shadow(0 1px 0.8px rgba(0,0,0,.28))"><g transform="translate(0 4.4)"><path d="M0.6 3V5.1A10.4 2.5 0 0 0 21.4 5.1V3Z" fill="#375546"></path><path d="M3.6 4.9V6.7M9.8 5.45V7.5M16.2 5.2V7.2" stroke="rgba(255,255,255,.85)" stroke-width="1.6"></path><ellipse cx="11" cy="3" rx="10.4" ry="2.5" fill="#4E7A64"></ellipse><ellipse cx="11" cy="3" rx="7" ry="1.6" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="0.7" stroke-dasharray="1.8 1.4"></ellipse></g><g transform="translate(0 2.2)"><path d="M0.6 3V5.1A10.4 2.5 0 0 0 21.4 5.1V3Z" fill="#7f423b"></path><path d="M3.6 4.9V6.7M9.8 5.45V7.5M16.2 5.2V7.2" stroke="rgba(255,255,255,.85)" stroke-width="1.6"></path><ellipse cx="11" cy="3" rx="10.4" ry="2.5" fill="#B65F55"></ellipse><ellipse cx="11" cy="3" rx="7" ry="1.6" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="0.7" stroke-dasharray="1.8 1.4"></ellipse></g><g transform="translate(0 0.0)"><path d="M0.6 3V5.1A10.4 2.5 0 0 0 21.4 5.1V3Z" fill="#c6c3bb"></path><path d="M3.6 4.9V6.7M9.8 5.45V7.5M16.2 5.2V7.2" stroke="rgba(21,24,29,.5)" stroke-width="1.6"></path><ellipse cx="11" cy="3" rx="10.4" ry="2.5" fill="#ECE8DF"></ellipse><ellipse cx="11" cy="3" rx="7" ry="1.6" fill="none" stroke="rgba(21,24,29,.5)" stroke-width="0.7" stroke-dasharray="1.8 1.4"></ellipse></g></svg><span class="mono">$1/$2</span></span>
      <span class="pill">$200 free buy-in</span>
      <span class="pill">12h turns</span>
    </div>
  </div>

  <div class="mono" style="position: absolute; left: 70px; bottom: 44px; font-size: 20px; color: var(--muted)">yourapp.com/t/k7q2</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C6F432","#5AC8FA"]},"$preview":{"width":1200,"height":630}}'>
// 1200×630 Open Graph image for the invite link. Big type so it still reads as a small chat bubble.
const SEATED = [
  { ini: 'M', hex: '#9DB8A0' }, { ini: 'J', hex: '#93AAC7' }, { ini: 'P', hex: '#C9A08C' }, { ini: 'S', hex: '#B59BB8' }, { ini: 'T', hex: '#CDB98A' }
];
class Component extends DCLogic {
  renderVals() {
    const P = this.props, dark = P.dark ?? false, accent = P.accent ?? '#FF5B2E';
    return {
      themeCls: dark ? 't-dark' : 't-light',
      seated: SEATED,
      // lime/sky accents are too light to read as text on the light theme; fall back to ink there
      accentText: !dark && accent !== '#FF5B2E' ? 'var(--fg)' : accent
    };
  }
}
</script>
</body>
</html>
