<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your-turn nudge preview card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/*BASE*/
.bigback{position:absolute;border-radius:20px;background:var(--back);color:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 5px var(--back),inset 0 0 0 7px rgba(255,255,255,.16),16px 20px 36px var(--sd)}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Bricolage Grotesque', system-ui, sans-serif">

  <div style="position: absolute; left: 76px; top: 80px; width: 700px; display: flex; flex-direction: column; gap: 24px">
    <span class="caps" style="font-size: 20px; letter-spacing: .14em">Friday Night · Hand #14</span>
    <div style="font-size: 124px; line-height: 0.88; font-weight: 800; letter-spacing: -0.05em">You’re up, Kai.</div>
    <div style="font-size: 30px; font-weight: 600; color: var(--muted)">Theo raised to $6.</div>
    <div style="display: flex; align-items: center; gap: 22px; margin-top: 10px">
      <span class="accentBtn" style="height: 72px; padding: 0 30px; border-radius: 24px; display: inline-flex; align-items: center; font-size: 32px; font-weight: 800; background: {{accent}}">$6 to call</span>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="mono" style="font-size: 24px; font-weight: 600">11h 42m left</span>
        <div class="inset" style="width: 220px; height: 12px; border-radius: 6px; overflow: hidden; box-shadow: inset 2px 2px 5px var(--sd), inset -2px -2px 5px var(--sl)">
          <div style="width: 97.5%; height: 100%; border-radius: 6px; background: {{accent}}"></div>
        </div>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 820px; top: 150px; width: 320px; height: 340px">
    <div class="bigback" style="left: 10px; top: 36px; width: 180px; height: 256px; transform: rotate(-10deg)">
      <svg width="96" height="96" viewBox="0.8 1.75 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="16" r="4.5"></circle><path d="M9 11.5V8.5"></path><path d="M6.5 8.5a2.5 2.5 0 0 1 5 0z"></path><path d="M11.2 7.4l7.3 5.1"></path><circle cx="18.5" cy="16.5" r="2.6"></circle></svg>
    </div>
    <div class="bigback" style="left: 124px; top: 8px; width: 180px; height: 256px; transform: rotate(9deg)">
      <svg width="96" height="96" viewBox="0.8 1.75 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="16" r="4.5"></circle><path d="M9 11.5V8.5"></path><path d="M6.5 8.5a2.5 2.5 0 0 1 5 0z"></path><path d="M11.2 7.4l7.3 5.1"></path><circle cx="18.5" cy="16.5" r="2.6"></circle></svg>
    </div>
  </div>

  <div class="mono" style="position: absolute; left: 76px; bottom: 44px; font-size: 20px; color: var(--muted)">Only you can see your cards. Tap to play.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#FF5B2E","options":["#FF5B2E","#C6F432","#5AC8FA"]},"$preview":{"width":1200,"height":630}}'>
// 1200×630 Open Graph image for the your-turn nudge posted in the group chat.
// The whole chat sees this, so it only ever shows card backs, never hole cards.
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    return { themeCls: (P.dark ?? false) ? 't-dark' : 't-light', accent: P.accent ?? '#FF5B2E' };
  }
}
</script>
</body>
</html>
