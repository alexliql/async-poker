name = "async-holdem"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/t/*", "/og/*"]

[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableObject"]

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[observability]
enabled = true
